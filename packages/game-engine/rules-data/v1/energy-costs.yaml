# Energy costs for all player actions.
# These values define how much energy each action type requires.

energy_costs:
  # Career actions
  accept_job: 3
  negotiate_job: 6
  quit_job: 2

  # Investment actions
  invest_small: 3
  invest_large: 8
  sell_investment: 2

  # Business actions
  launch_business: 15
  manage_business: 5
  close_business: 3

  # Social actions
  attend_event: 2
  meet_character: 2
  network: 3

  # Challenge actions
  participate_challenge: 5
  challenge_rival: 12

  # Risk management
  mitigate_risk: 8
  accept_risk: 3

  # Partnership actions
  accept_partnership: 3
  negotiate_partnership: 6

  # Advanced actions
  major_takeover: 20
  apply_for_opportunity: 3

  # Market actions
  acknowledge_market: 0

  # Default actions (pass/reject cost nothing)
  reject: 0
  pass: 0
  decline: 0
