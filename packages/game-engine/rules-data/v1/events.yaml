events:
  - type: job_offer
    display_name: Job Offer
    category: career
    eligibility:
      min_level: 1
      min_energy: 3
    generation:
      base_probability: 0.35
      modifiers:
        charisma: 0.08
        reputation: 0.05
        negotiation: 0.03
      cooldown_hours: 4
      max_per_day: 2
    choices:
      - key: ACCEPT
        label: Accept Offer
        energy_cost: 3
        description: Accept the job at the offered salary.
      - key: NEGOTIATE
        label: Negotiate Terms
        energy_cost: 6
        description: Try to negotiate a higher salary. Risk of losing the offer.
      - key: REJECT
        label: Decline
        energy_cost: 0
        description: Pass on this opportunity.
    outcomes:
      ACCEPT:
        resolver: salary
        base_effects:
          reputation: 1
          influence: 1
        variable_effects:
          salary: { formula: salary_calculation }
      NEGOTIATE:
        resolver: negotiation
        base_effects:
          reputation: -1
        variable_effects:
          salary: { formula: negotiation_salary }
      REJECT:
        resolver: pass
        base_effects:
          experience: 5
    ai:
      narrate_if_importance_gte: 50
      template_fallback: "A recruiter from {{company}} reaches out about a {{role}} position with a salary range of ${{salaryMin}}-${{salaryMax}}."
    importance:
      base: 40
      modifiers:
        negotiation: 5
        charisma: 3

  - type: investment
    display_name: Investment Opportunity
    category: finance
    eligibility:
      min_level: 2
      min_energy: 3
      min_cash: 5000
    generation:
      base_probability: 0.30
      modifiers:
        strategy: 0.10
        risk_appetite: 0.08
        creativity: 0.04
      cooldown_hours: 3
      max_per_day: 3
    choices:
      - key: ACCEPT
        label: Invest
        energy_cost: 3
        description: Put your money into this investment.
      - key: REJECT
        label: Pass
        energy_cost: 0
        description: Skip this investment opportunity.
    outcomes:
      ACCEPT:
        resolver: investment
        variable_effects:
          return: { formula: investment_calculation }
      REJECT:
        resolver: pass
        base_effects:
          experience: 5
    ai:
      narrate_if_importance_gte: 45
      template_fallback: "An investment opportunity arises in the {{sector}} sector through {{company}}. Risk level: {{riskLevel}}."
    importance:
      base: 45
      modifiers:
        strategy: 5
        risk_appetite: 8

  - type: partnership
    display_name: Partnership Proposal
    category: relationships
    eligibility:
      min_level: 3
      min_energy: 3
      min_reputation: 20
    generation:
      base_probability: 0.20
      modifiers:
        charisma: 0.08
        negotiation: 0.06
        reputation: 0.06
      cooldown_hours: 6
      max_per_day: 1
    choices:
      - key: ACCEPT
        label: Accept Partnership
        energy_cost: 3
        description: Enter the partnership at the proposed terms.
      - key: NEGOTIATE
        label: Counter-Propose
        energy_cost: 6
        description: Try to get better terms. May cause the partner to walk away.
      - key: REJECT
        label: Decline
        energy_cost: 0
        description: Turn down the partnership.
    outcomes:
      ACCEPT:
        resolver: negotiation
        base_effects:
          reputation: 2
          influence: 2
        variable_effects:
          cash: { formula: partnership_gain }
      NEGOTIATE:
        resolver: negotiation
        base_effects:
          reputation: -1
        variable_effects:
          cash: { formula: negotiation_partnership }
      REJECT:
        resolver: pass
        base_effects:
          experience: 5
    ai:
      narrate_if_importance_gte: 55
      template_fallback: "{{partnerName}} from {{company}} proposes a partnership with a {{proposedSplit}}/{{partnerSplit}} revenue split."
    importance:
      base: 55
      modifiers:
        negotiation: 5
        charisma: 5

  - type: market_event
    display_name: Market Movement
    category: economy
    eligibility:
      min_level: 1
    generation:
      base_probability: 0.25
      modifiers:
        strategy: 0.05
      cooldown_hours: 2
      max_per_day: 3
    choices:
      - key: ACKNOWLEDGE
        label: Acknowledge
        energy_cost: 0
        description: Take note of the market movement.
    outcomes:
      ACKNOWLEDGE:
        resolver: market
        variable_effects:
          portfolio: { formula: market_impact }
    ai:
      narrate_if_importance_gte: 60
      template_fallback: "The {{sector}} market has {{direction}} by {{magnitude}}%, affecting your portfolio."
    importance:
      base: 30
      modifiers:
        strategy: 3

  - type: business_launch
    display_name: Business Opportunity
    category: entrepreneurship
    eligibility:
      min_level: 3
      min_energy: 15
      max_active_businesses: 5
      min_cash: 10000
    generation:
      base_probability: 0.15
      modifiers:
        creativity: 0.10
        strategy: 0.06
        risk_appetite: 0.04
      cooldown_hours: 12
      max_per_day: 1
    choices:
      - key: ACCEPT
        label: Launch Business
        energy_cost: 15
        description: Invest the startup costs and launch the business.
      - key: REJECT
        label: Pass
        energy_cost: 0
        description: Not the right time for this venture.
    outcomes:
      ACCEPT:
        resolver: business
        base_effects:
          reputation: 3
          influence: 2
        variable_effects:
          startup_cost: { formula: business_launch_cost }
      REJECT:
        resolver: pass
        base_effects:
          experience: 5
    ai:
      narrate_if_importance_gte: 50
      template_fallback: "An opportunity to launch a {{businessType}} called '{{name}}' with a startup cost of ${{startupCost}}."
    importance:
      base: 60
      modifiers:
        creativity: 8
        strategy: 5

  - type: risk_event
    display_name: Risk Event
    category: crisis
    eligibility:
      min_level: 2
      min_energy: 3
    generation:
      base_probability: 0.18
      modifiers:
        discipline: -0.05
        strategy: -0.03
      cooldown_hours: 4
      max_per_day: 2
    choices:
      - key: MITIGATE
        label: Mitigate Risk
        energy_cost: 8
        description: Spend energy to actively reduce the impact.
      - key: ACCEPT
        label: Accept Consequences
        energy_cost: 3
        description: Take the hit and move on.
    outcomes:
      MITIGATE:
        resolver: risk
        variable_effects:
          damage: { formula: mitigated_risk }
      ACCEPT:
        resolver: risk
        variable_effects:
          damage: { formula: full_risk }
    ai:
      narrate_if_importance_gte: 40
      template_fallback: "A {{event}} with severity level {{severity}} threatens your operations. Potential damage: ${{potentialDamage}}."
    importance:
      base: 65
      modifiers:
        discipline: -5
        strategy: -3

  - type: skill_challenge
    display_name: Skill Challenge
    category: personal_growth
    eligibility:
      min_level: 1
      min_energy: 5
    generation:
      base_probability: 0.25
      modifiers:
        discipline: 0.06
        creativity: 0.04
        strategy: 0.03
      cooldown_hours: 3
      max_per_day: 2
    choices:
      - key: ACCEPT
        label: Participate
        energy_cost: 5
        description: Enter the challenge and test your skills.
      - key: REJECT
        label: Skip
        energy_cost: 0
        description: Not interested in this challenge.
    outcomes:
      ACCEPT:
        resolver: skill_check
        base_effects:
          reputation: 1
        variable_effects:
          reward: { formula: skill_reward }
      REJECT:
        resolver: pass
        base_effects:
          experience: 5
    ai:
      narrate_if_importance_gte: 40
      template_fallback: "A {{challenge}} is happening! Difficulty: {{difficulty}}. Primary skill: {{primaryAttribute}}. Cash prize: ${{cashPrize}}."
    importance:
      base: 35
      modifiers:
        discipline: 5
        creativity: 3

  - type: social_event
    display_name: Social Event
    category: networking
    eligibility:
      min_level: 1
      min_energy: 2
    generation:
      base_probability: 0.30
      modifiers:
        charisma: 0.10
        reputation: 0.05
      cooldown_hours: 2
      max_per_day: 3
    choices:
      - key: ACCEPT
        label: Attend
        energy_cost: 2
        description: Show up, network, and make connections.
      - key: REJECT
        label: Skip
        energy_cost: 0
        description: Stay home and rest.
    outcomes:
      ACCEPT:
        resolver: social
        base_effects:
          reputation: 1
          influence: 1
        variable_effects:
          relationships: { formula: social_networking }
      REJECT:
        resolver: pass
        base_effects:
          experience: 3
    ai:
      narrate_if_importance_gte: 35
      template_fallback: "You're invited to a {{event}}. {{attendeeCount}} notable attendees will be there. Networking quality: {{networkingQuality}}."
    importance:
      base: 25
      modifiers:
        charisma: 5
        reputation: 3
