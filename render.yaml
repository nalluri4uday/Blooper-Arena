services:
  - type: web
    name: blooper-arena-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_API_KEY
        sync: false
      - key: WORKER_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    plan: free
